name: Build and Publish to AWS
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Setup IndexNow # Generate files dynamically to prevent them from being leaked in public repositories.
        run: echo ${{ secrets.INDEXNOW_KEY }} > static/${{ secrets.INDEXNOW_KEY }}.txt
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.6
      - name: Build
        run: zola build
      # Brotli (quality 11) and zopfli (the smallest gzip) copies of every text
      # file, in public/_br/ and public/_gz/ under their original paths, so S3
      # still guesses the right Content-Type. The CloudFront Function in
      # cloudfront/precompressed.js serves them; CloudFront's own on-the-fly
      # compression is weaker. COMPRESSIBLE must match the list in that function.
      - name: Pre-compress
        run: |
          sudo apt-get install -y --no-install-recommends brotli zopfli > /dev/null
          COMPRESSIBLE=(html css js mjs json xml xsl txt svg ico ttf webmanifest map)
          match=()
          for ext in "${COMPRESSIBLE[@]}"; do match+=(-o -iname "*.$ext"); done

          cd public
          find . -type f \( "${match[@]:1}" \) -printf '%P\0' > ../compressible
          # Tiny files can come out bigger when compressed. Their copy then holds
          # the original bytes instead, listed in ../uncompressed-br or -gz so the
          # deploy uploads it without Content-Encoding. The function still finds
          # a copy at the expected path; it's just not compressed.
          : > ../uncompressed-br; : > ../uncompressed-gz
          xargs -0 -P "$(nproc)" -n 1 sh -c '
            mkdir -p "_br/$(dirname "$1")" "_gz/$(dirname "$1")"
            brotli --quality=11 --lgwin=24 --stdout -- "$1" > "_br/$1"
            zopfli -c -- "$1" > "_gz/$1"
            for enc in br gz; do
              if [ "$(wc -c < "_$enc/$1")" -ge "$(wc -c < "$1")" ]; then
                cp -- "$1" "_$enc/$1"
                echo "$1" >> "../uncompressed-$enc"
              fi
            done
          ' sh < ../compressible
          echo "Compressed $(tr -cd '\0' < ../compressible | wc -c) files" \
            "($(xargs -0 du -ck < ../compressible | tail -1 | cut -f1) KB):" \
            "brotli $(du -sk _br | cut -f1) KB, gzip $(du -sk _gz | cut -f1) KB"
          echo "Kept uncompressed (not smaller):" \
            "brotli $(wc -l < ../uncompressed-br), gzip $(wc -l < ../uncompressed-gz)"
      # Deployed with the AWS CLI (preinstalled on the runner) instead of a
      # third-party action, so there is no Node runtime to be deprecated.
      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-west-1
          BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          # Assets are either hash-busted by Zola (CSS/JS) or get a new filename when
          # replaced, so they can be cached for a year. Everything else (HTML, feeds,
          # robots.txt, the feed stylesheet…) keeps the same URL across deploys and
          # gets a week, matched by whatever the first pass did not claim.
          ASSETS=(js css svg ttf woff woff2 pdf png jpg jpeg JPG JPEG gif ico webp avif)
          include=() exclude=()
          for ext in "${ASSETS[@]}"; do
            include+=(--include "*.$ext")
            exclude+=(--exclude "*.$ext")
          done

          # Sync public/ (or one of its compressed copies) to the bucket, with
          # both cache lifetimes; extra arguments are passed to both passes, last,
          # because later --include/--exclude filters win.
          # --exclude '*.DS_Store' keeps macOS junk out if public/ was built locally.
          sync() {
            local src="$1" dest="$2"; shift 2
            aws s3 sync "$src" "$dest" --delete --no-progress \
              --exclude '*' "${include[@]}" \
              --cache-control 'max-age=31536000, public' "$@"
            aws s3 sync "$src" "$dest" --delete --no-progress \
              "${exclude[@]}" --exclude '*.DS_Store' \
              --cache-control 'max-age=604800, public' "$@"
          }

          # Compressed copies first, so the function never points at a copy
          # that isn't there yet. Excluded paths are also kept out of --delete,
          # so syncing the originals leaves _br/ and _gz/ alone, and syncing the
          # copies leaves the uncompressed ones (see Pre-compress) alone.
          for enc in br gz; do
            if [ "$enc" = br ]; then encoding=br; else encoding=gzip; fi
            skip=()
            while IFS= read -r f; do skip+=(--exclude "$f"); done < "uncompressed-$enc"
            sync "public/_$enc/" "s3://$BUCKET/_$enc" --content-encoding "$encoding" "${skip[@]}"

            while IFS= read -r f; do
              cache='max-age=604800, public'
              for ext in "${ASSETS[@]}"; do
                if [[ "$f" == *."$ext" ]]; then cache='max-age=31536000, public'; fi
              done
              aws s3 cp "public/_$enc/$f" "s3://$BUCKET/_$enc/$f" --no-progress --cache-control "$cache"
            done < "uncompressed-$enc"
          done
          sync public/ "s3://$BUCKET" --exclude '_br/*' --exclude '_gz/*'
      - name: Invalidate CloudFront
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: eu-west-1
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
