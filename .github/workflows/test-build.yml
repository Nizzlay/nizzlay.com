name: Test build

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test Site Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: true

      # Fails when tabi changed a template the site keeps a modified copy of.
      - name: Check template overrides
        run: scripts/template-overrides.sh check

      - name: Zola Build
        uses: shalzz/zola-deploy-action@v0.23.6
        env:
          BUILD_ONLY: true
